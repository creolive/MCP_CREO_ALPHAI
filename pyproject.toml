[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "MCP_CREO_MechDog"
dynamic = ["version"]
description = "Local Creo Toolkit MCP service, installed from a source checkout"
requires-python = ">=3.12"
license = "MIT"

[tool.setuptools]
packages = ["creo_mechdog"]
py-modules = ["version", "schema", "airfoil", "profile_checks", "bridge", "seeds", "capabilities"]
package-dir = {creo_mechdog = "src/creo_mechdog"}

[tool.setuptools.dynamic]
version = {attr = "version.VERSION"}

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
extend-exclude = [
    ".tmp", "build", "jobs", "models", "native/third_party",
    # BUG-001: historical evidence is immutable, including archived Python drivers.
    "docs/validation",
]

[tool.ruff.lint]
select = ["E4", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
# Existing standalone scripts locate the source checkout before importing it.
"tools/*.py" = ["E402"]
"tests/*.py" = ["E402"]
"seed_library/*.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
# DEV-025: preserve immutable external reports, including their Python code blocks.
exclude = [
    "docs/validation/2026-10-15_CREO_0.3.0_旧版ToolkitSDK原生编译失败.md",
    "docs/validation/feedback-2026-10-16/2026-10-16常驻回调注册负担与版本发现缺口.md",
]
